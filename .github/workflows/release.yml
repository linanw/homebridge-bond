name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    if: github.repository == 'linanw/homebridge-bond' && (github.event_name == 'push' || github.ref == 'refs/heads/matter')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      dist-tag: ${{ steps.package.outputs.dist-tag }}
      integrity: ${{ steps.archive.outputs.integrity }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Verify the package name and version tag
        id: package
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const pkg = require('./package.json');
          const { version } = pkg;

          if (pkg.name !== '@linanw/homebridge-bond' ||
              pkg.repository?.url !== 'git+https://github.com/linanw/homebridge-bond.git' ||
              pkg.publishConfig?.access !== 'public') {
            throw new Error('Expected the public Bond package from the linanw fork');
          }
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(version)) {
            throw new Error('Expected an npm release version without build metadata');
          }
          if (process.env.GITHUB_EVENT_NAME === 'push' && process.env.GITHUB_REF !== `refs/tags/v${version}`) {
            throw new Error(`Tag must be v${version}`);
          }

          const distTag = version.includes('-') ? 'beta' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ndist-tag=${distTag}\n`);
          NODE
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Inspect and test the npm tarball
        id: archive
        run: |
          mkdir -p "$RUNNER_TEMP/bond-release"
          npm pack --dry-run --ignore-scripts
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/bond-release" > "$RUNNER_TEMP/bond-pack.json"
          pack_info="$RUNNER_TEMP/bond-pack.json"
          archive="$RUNNER_TEMP/bond-release/$(jq -er '.[0].filename' "$pack_info")"
          install_dir="$RUNNER_TEMP/bond-pack-check"
          npm install --prefix "$install_dir" --ignore-scripts --no-audit --no-fund "$archive"
          ln -s "$PWD/node_modules/homebridge" "$install_dir/node_modules/homebridge"
          BOND_TEST_INSTALLED_PACKAGE="$install_dir/node_modules/@linanw/homebridge-bond" node --test tests/fan-report.test.mjs
          echo "integrity=$(jq -er '.[0].integrity' "$pack_info")" >> "$GITHUB_OUTPUT"
      - name: Upload the tested tarball
        uses: actions/upload-artifact@v7
        with:
          name: bond-release
          path: ${{ runner.temp }}/bond-release/*.tgz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    concurrency:
      group: bond-npm-publish
      queue: max
    env:
      VERSION: ${{ needs.pack.outputs.version }}
      DIST_TAG: ${{ needs.pack.outputs.dist-tag }}
      INTEGRITY: ${{ needs.pack.outputs.integrity }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: bond-release
      - name: Publish with npm Trusted Publishing
        run: |
          archive="linanw-homebridge-bond-$VERSION.tgz"
          archive_integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          test "$archive_integrity" = "$INTEGRITY"
          existing="$RUNNER_TEMP/bond-published.json"
          status=$(curl --silent --show-error --retry 2 --max-time 10 --output "$existing" --write-out '%{http_code}' \
            "https://registry.npmjs.org/@linanw%2fhomebridge-bond/$VERSION")
          case "$status" in
            404) npm publish "$archive" --ignore-scripts --access public --tag "$DIST_TAG" ;;
            200) test "$(jq -er '.dist.integrity' "$existing")" = "$INTEGRITY" ;;
            *) echo "Could not check npm for $VERSION (HTTP $status)" >&2; exit 1 ;;
          esac
      - name: Verify the public npm release
        run: |
          node <<'NODE'
          const { setTimeout: sleep } = require('node:timers/promises');
          const { VERSION, DIST_TAG, INTEGRITY } = process.env;
          const registry = 'https://registry.npmjs.org';
          const pkg = '@linanw%2fhomebridge-bond';

          (async () => {
            for (let attempt = 0; attempt < 18; attempt++) {
              const version = await fetch(`${registry}/${pkg}/${VERSION}`, { signal: AbortSignal.timeout(10000) });
              const tags = await fetch(`${registry}/-/package/${pkg}/dist-tags`, { signal: AbortSignal.timeout(10000) });
              if (version.ok && tags.ok) {
                const record = await version.json();
                if (record.dist.integrity !== INTEGRITY) {
                  throw new Error('Published archive integrity does not match the tested archive');
                }
                if ((await tags.json())[DIST_TAG] === VERSION) {
                  console.log(`Verified @linanw/homebridge-bond@${VERSION} on npm tag ${DIST_TAG} (${INTEGRITY})`);
                  return;
                }
              }
              await sleep(10000);
            }
            throw new Error(`npm did not expose ${VERSION} under ${DIST_TAG}`);
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

  github-release:
    needs: [pack, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DIST_TAG: ${{ needs.pack.outputs.dist-tag }}
    steps:
      - name: Create the release for the published tag
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          options=()
          if [[ "$DIST_TAG" == "beta" ]]; then
            options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${options[@]}" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes \
            --notes "Install from npm with \`npm install -g @linanw/homebridge-bond@${GITHUB_REF_NAME#v}\`."
